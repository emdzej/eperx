<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eperx</title>
    <meta
      name="description"
      content="Browser client for the ePER Fiat group parts catalogue. Reads the original data client-side; no backend."
    />
    <script>
      // Apply the persisted theme before mount, so the first paint matches and
      // the page does not flash the wrong palette.
      //
      // Three states. `auto` — the default, and anything unrecognised — asks
      // the machine; `light` and `dark` are explicit. The light palette is the
      // Italian flag off-white (#F4F5F0), which the green and red accents pop
      // against, so light is what `auto` resolves to on a machine with no
      // preference.
      try {
        const saved = localStorage.getItem("eperx.theme");
        const dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body class="bg-base text-foreground antialiased">
    <div id="app" class="h-screen w-screen overflow-hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
